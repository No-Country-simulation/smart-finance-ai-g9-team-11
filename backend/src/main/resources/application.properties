spring.application.name=finance-ai-api

# ==========================
# Configuracoes do banco de dados MySQL
# ==========================
spring.datasource.url=jdbc:mysql://localhost:3306/finance_ai?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# Configuracoes do Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==========================
# Configuracoes do FlyWay
# ==========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=0

# ==========================
# Configuracoes do servico do FastAPI
# ==========================
ml.api.url=http://localhost:8000