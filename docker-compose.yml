networks:
  finance-network:
    driver: bridge

services:
  db:
    image: mysql:8.0
    container_name: finance-db
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=finance_ai
    ports:
      - "3307:3306"
    volumes:
      - finance-db-data:/var/lib/mysql
    networks:
      - finance-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-service:
    container_name: ml-service
    build:
      context: .
      dockerfile: docker/ml.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OCI_STORAGE_BUCKET=finance-ai-bucket
    networks:
      - finance-network

  backend-service:
    container_name: backend-service
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - ML_API_URL=${ML_API_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started
    networks:
      - finance-network

  frontend-service:
    container_name: frontend-service
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend-service
    networks:
      - finance-network

volumes:
  finance-db-data: